[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hushcheck"
dynamic = ["version"]
description = "Find text that a speech-to-text engine invented over silence or music, by checking each transcript line against the audio."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Boobalan Arjunan" }]
dependencies = ["numpy>=1.23", "scipy>=1.9", "soundfile>=0.12"]
classifiers = ["Development Status :: 3 - Alpha", "License :: OSI Approved :: MIT License", "Topic :: Multimedia :: Sound/Audio :: Speech"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
hushcheck = "hushcheck.cli:main"

[tool.setuptools.dynamic]
version = { attr = "hushcheck._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
